<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{NONCE}}'; style-src 'nonce-{{NONCE}}'; connect-src 'none'; img-src data:; font-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Steed tabs</title>
  <style nonce="{{NONCE}}">{{STYLE}}{{EXTRA_STYLE}}</style>
</head>
<body>
  <div id="strip" class="strip">
    <div id="tabs" class="tabs" role="tablist" aria-label="Open tabs"></div>
    <div class="tail"><span id="count" class="count" hidden></span><button id="new-end" class="new-tab" type="button" aria-label="New tab" title="New tab (Ctrl+T)" hidden>+</button></div>
  </div>
  <script nonce="{{NONCE}}">{{CHANNEL}}</script>
  <script nonce="{{NONCE}}">"use strict"; const STEED_GENERATION = "{{GENERATION}}"; {{SCRIPT}}</script>
</body>
</html>
