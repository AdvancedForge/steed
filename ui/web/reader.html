<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-{{NONCE}}'; style-src 'nonce-{{NONCE}}'; connect-src 'none'; img-src data:; font-src 'none'; frame-src 'none'; worker-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Reader</title><style nonce="{{NONCE}}">{{STYLE}}{{EXTRA_STYLE}}</style></head>
<body><div class="reader-bar" role="toolbar" aria-label="Reader view">
<button id="smaller" aria-label="Smaller text">A−</button><button id="larger" aria-label="Larger text">A+</button>
<span class="themes" role="radiogroup" aria-label="Theme"><button data-theme="photo" role="radio" title="Colours from your New Tab photo">Photo colours</button><button data-theme="light" role="radio">Light</button><button data-theme="sepia" role="radio">Sepia</button><button data-theme="dark" role="radio">Dark</button></span>
<button id="images" aria-pressed="true">Images</button>
<button id="highlight" disabled title="Select text in a paragraph first">Highlight</button>
<button id="close" class="close">Exit reader (F9)</button></div>
<main class="reader"><header><p id="site" class="site"></p><h1 id="title"></h1><p id="meta" class="meta"></p></header><article id="body"></article></main>
<form id="note-editor" class="note-editor" hidden><label for="note-text">Note</label><textarea id="note-text" rows="3"></textarea>
<div class="note-actions"><button type="submit">Save note</button><button type="button" id="unhighlight">Remove highlight</button><button type="button" id="note-close">Close</button></div></form>
<script nonce="{{NONCE}}">{{CHANNEL}}</script><script nonce="{{NONCE}}">"use strict"; const STEED_GENERATION = "{{GENERATION}}"; {{SCRIPT}}</script></body></html>
